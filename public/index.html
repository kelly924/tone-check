<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tone Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #1f2e23;
    --pine-light: #2c4032;
    --bone: #f7f5f0;
    --panel: #ffffff;
    --brass: #b08d57;
    --text: #262220;
    --muted: #6b6459;
    --border: #ddd6c9;
    --error: #a13d2a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bone);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 40px 24px 12px;
    text-align: center;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 34px;
    margin: 0 0 8px;
    color: var(--pine);
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    max-width: 440px;
    margin: 0 auto;
    line-height: 1.5;
  }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 32px 24px 64px;
  }

  .card {
    width: 100%;
    max-width: 920px;
  }

  .code-row {
    display: none;
    justify-content: center;
    margin-bottom: 20px;
  }

  .code-row input {
    width: 220px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: var(--panel);
  }

  .panes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 720px) {
    .panes { grid-template-columns: 1fr; }
  }

  .pane {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 300px;
  }

  .pane-label {
    padding: 14px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--pine);
    border-bottom: 1px solid var(--border);
  }

  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    padding: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: var(--text);
    background: transparent;
  }

  .output-body {
    flex: 1;
    padding: 18px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-y: auto;
  }

  .output-body.placeholder {
    color: var(--muted);
  }

  .output-body.error {
    color: var(--error);
  }

  .pane-footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--pine);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 8px;
  }
  .copy-btn:hover { text-decoration: underline; }
  .copy-btn:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  .actions {
    display: flex;
    justify-content: center;
    margin-top: 24px;
  }

  button.primary {
    background: var(--pine);
    color: var(--bone);
    border: none;
    padding: 13px 34px;
    border-radius: 7px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.primary:hover:not(:disabled) { background: var(--pine-light); }
  button.primary:disabled { background: var(--border); color: var(--muted); cursor: default; }

  footer {
    text-align: center;
    padding: 0 24px 32px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>Tone Check</h1>
  <p>Paste in what you want to say. Get back a clear, professional version that keeps your meaning intact.</p>
</header>

<main>
  <div class="card">
    <div class="code-row" id="codeRow">
      <input type="password" id="accessCode" placeholder="Access code" />
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-label">What you want to say</div>
        <textarea id="inputText" maxlength="4000" placeholder="e.g. this is the third time i've told you the same thing, can you actually read the instructions next time"></textarea>
        <div class="pane-footer">
          <span id="charCount">0 / 4000</span>
        </div>
      </div>

      <div class="pane">
        <div class="pane-label">Professional version</div>
        <div class="output-body placeholder" id="outputText">Your rewritten message will show up here.</div>
        <div class="pane-footer">
          <span></span>
          <button class="copy-btn" id="copyBtn" disabled>Copy</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="rewriteBtn">Rewrite it</button>
    </div>
  </div>
</main>

<footer>Nothing you type here is stored.</footer>

<script>
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const rewriteBtn = document.getElementById('rewriteBtn');
  const copyBtn = document.getElementById('copyBtn');
  const charCount = document.getElementById('charCount');
  const codeRow = document.getElementById('codeRow');
  const accessCode = document.getElementById('accessCode');

  fetch('/api/config')
    .then((r) => r.json())
    .then((cfg) => {
      if (cfg.accessCodeRequired) codeRow.style.display = 'flex';
    })
    .catch(() => {});

  inputText.addEventListener('input', () => {
    charCount.textContent = `${inputText.value.length} / 4000`;
  });

  async function rewrite() {
    const text = inputText.value.trim();
    if (!text) {
      inputText.focus();
      return;
    }

    rewriteBtn.disabled = true;
    rewriteBtn.textContent = 'Rewriting…';
    outputText.className = 'output-body placeholder';
    outputText.textContent = 'Working on it…';
    copyBtn.disabled = true;

    try {
      const res = await fetch('/api/rewrite', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text, accessCode: accessCode.value }),
      });
      const data = await res.json();

      if (!res.ok) {
        outputText.className = 'output-body error';
        outputText.textContent = data.error || 'Something went wrong.';
      } else {
        outputText.className = 'output-body';
        outputText.textContent = data.rewritten;
        copyBtn.disabled = false;
      }
    } catch (err) {
      outputText.className = 'output-body error';
      outputText.textContent = 'Could not reach the server. Try again.';
    } finally {
      rewriteBtn.disabled = false;
      rewriteBtn.textContent = 'Rewrite it';
    }
  }

  rewriteBtn.addEventListener('click', rewrite);
  inputText.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') rewrite();
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputText.textContent).then(() => {
      copyBtn.textContent = 'Copied';
      setTimeout(() => (copyBtn.textContent = 'Copy'), 1500);
    });
  });
</script>

</body>
</html>
